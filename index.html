<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CHAMPA TikTok Web</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#000; overflow:hidden; font-family:sans-serif; }
    #feed { height:100vh; scroll-snap-type: y mandatory; overflow-y:scroll; }
    .video-container {
      height:100vh; scroll-snap-align: start; position:relative; color:white;
    }
    video { width:100%; height:100%; object-fit:cover; }
    .overlay {
      position:absolute; bottom:20px; right:15px; text-align:right;
    }
    .upload-btn {
      position:fixed; bottom:30px; left:50%; transform:translateX(-50%);
      background:#D4AF37; color:#000; width:60px; height:60px; border-radius:50%;
      font-size:40px; text-align:center; line-height:60px; z-index:100;
    }
    input{ display:none; }
  </style>
</head>
<body>

<div id="feed"></div>

<label class="upload-btn">+</label>
<input type="file" accept="video/*" id="upload" />

<script>
const feed = document.getElementById('feed');
const input = document.getElementById('upload');

input.addEventListener('change', (e) => {
  const file = e.target.files;
  if (!file) return;
  
  const url = URL.createObjectURL(file);
  const div = document.createElement('div');
  div.className = 'video-container';
  div.innerHTML = `
    <video src="${url}" autoplay loop muted playsinline></video>
    <div class="overlay">
      <h2 style="color:#D4AF37">CHAMPA KING</h2>
      <p>Champa sống lại rồi!</p>
      <div>❤️ 999K • 💬 88K</div>
    </div>
  `;
  feed.appendChild(div);
  div.scrollIntoView({ behavior: 'smooth' });
});
</script>

</body>
</html>
