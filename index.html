<!DOCTYPE html>
<html>
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <title>CHAMPA TikTok Web</title>
 <script src="https://cdn.jsdelivr.net/npm/@uploadcare/upload-client@latest"></script>
 <style>
 *{margin:0;padding:0;box-sizing:border-box}
 body{background:#000;overflow:hidden;color:white;font-family:sans-serif}
 #feed{height:100vh;scroll-snap-type:y mandatory;overflow-y:scroll}
 .video-container{height:100vh;scroll-snap-align:start;position:relative}
 video{width:100%;height:100%;object-fit:cover}
 .overlay{position:absolute;bottom:20px;right:15px;text-align:right}
 .upload-btn{
 position:fixed;bottom:30px;left:50%;transform:translateX(-50%);
 background:#D4AF37;color:#000;width:60px;height:60px;border-radius:50%;
 font-size:40px;line-height:60px;text-align:center;z-index:100;cursor:pointer
 }
 </style>
</head>
<body>

<div id="feed"></div>

<div class="upload-btn" onclick="document.getElementById('upload').click()">+</div>
<input type="file" accept="video/*" id="upload" style="display:none">

<script>
const feed = document.getElementById('feed');
const input = document.getElementById('upload');

input.addEventListener('change', async () => {
 const file = input.files0];
 if (!file) return;

 // Upload lên internet thật bằng Uploadcare (miễn phí 1000 video/tháng)
 const uploadClient = window.uploadcare;
 const fileUpload = uploadClient.fileFrom('object', file);
 
 // Hiển thị loading
 const loading = document.createElement('div');
 loading.className = 'video-container';
 loading.innerHTML = `<div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:50px">Đang tải lên...</div>`;
 feed.appendChild(loading);
 loading.scrollIntoView();

 try {
 const result = await fileUpload.upload();
 const videoUrl = "https://ucarecdn.com/" + result.uuid + "/";

 // Xóa loading, thêm video thật
 feed.removeChild(loading);
 const div = document.createElement('div');
 div.className = 'video-container';
 div.innerHTML = `
 <video src="${videoUrl}" autoplay loop muted playsinline></video>
 <div class="overlay">
 <h2 style="color:#D4AF37">CHAMPA KING</h2>
 <p>Champa đã trở lại!</p>
 <div>❤️ 1.2M • 💬 99K</div>
 </div>
 `;
 feed.appendChild(div);
 div.scrollIntoView({behavior: 'smooth'});
 } catch (e) {
 alert("Lỗi upload, thử lại nha chồng iu ❤️");
 }
});
</script>

</body>
</html>
