<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CHAMPA KING</title>
  <script src="https://cdn.jsdelivr.net/npm/@uploadcare/upload-client@latest"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#000;color:white;font-family:sans-serif;overflow:hidden}
    #feed{height:100vh;scroll-snap-type:y mandatory;overflow-y:scroll}
    .video{height:100vh;scroll-snap-align:start;position:relative}
    video{width:100%;height:100%;object-fit:cover}
    .overlay{position:absolute;bottom:20px;right:15px;text-align:right}
    .upload-btn{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);
      background:#D4AF37;color:#000;width:60px;height:60px;border-radius:50%;
      font-size:40px;line-height:60px;text-align:center;z-index:100;cursor:pointer}
    .tab{position:fixed;top:15px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.7);padding:10px 20px;border-radius:30px;z-index:99}
  </style>
</head>
<body>

<div class="tab">
  <a href="https://champa-king.com" style="color:#D4AF37;text-decoration:none">Kho video</a>
</div>

<div id="feed"></div>

<div class="upload-btn" onclick="document.getElementById('upload').click()">+</div>
<input type="file" accept="video/*" id="upload" style="display:none">

<script>
const feed = document.getElementById('feed');
const input = document.getElementById('upload');
let videoCount = localStorage.getItem('champa_count') || 0;
videoCount = parseInt(videoCount);

input.addEventListener('change', async () => {
  const file = input.files;
  if (!file) return;

  const loading = document.createElement('div');
  loading.className = 'video';
  loading.innerHTML = `<div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:50px">Đang tải lên...</div>`;
  feed.appendChild(loading);
  loading.scrollIntoView();

  try {
    const result = await window.uploadcare.fileFrom('object', file).upload();
    const videoUrl = "https://ucarecdn.com/" + result.uuid + "/";

    videoCount++;
    localStorage.setItem('champa_count', videoCount);
    localStorage.setItem('champa_video_' + videoCount, videoUrl);

    feed.removeChild(loading);
    const div = document.createElement('div');
    div.className = 'video';
    div.innerHTML = `
      <video src="${videoUrl}" autoplay loop muted playsinline></video>
      <div class="overlay">
        <h2 style="color:#D4AF37">CHAMPA KING</h2>
        <p>Video #${videoCount} – Champa sống lại!</p>
        <div>❤️ 2.8M • 💬 188K</div>
      </div>
    `;
    feed.appendChild(div);
    div.scrollIntoView({behavior: 'smooth'});
  } catch (e) {
    alert("Lỗi upload, thử lại nha chồng iu ❤️");
  }
});

// Load lại kho cũ khi mở app
for(let i = 1; i <= videoCount; i++) {
  const url = localStorage.getItem('champa_video_' + i);
  if(url) {
    const div = document.createElement('div');
    div.className = 'video';
    div.innerHTML = `
      <video src="${url}" autoplay loop muted playsinline></video>
      <div class="overlay">
        <h2 style="color:#D4AF37">CHAMPA KING</h2>
        <p>Video #${i}</p>
      </div>
    `;
    feed.appendChild(div);
  }
}
</script>

</body>
</html>
